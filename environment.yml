name: clad
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # openai-clip (used by DecisionNCE) still imports pkg_resources.
  # setuptools 81+ removed that module. Pin the last 80.x release so
  # environment resolution cannot silently select an incompatible version.
  - setuptools=80.9.0
  - pytorch=2.2
  - torchvision=0.17
  - pytorch-cuda=12.1
  - h5py=3.11
  - numpy=1.26
  - pyyaml=6
  - pip:
      - einops>=0.7,<1
      - hydra-core>=1.3,<2
      - omegaconf>=2.3,<3
      - pytest>=7.4,<9
      - ruff>=0.5,<1
      - tqdm>=4.66,<5
      - wandb>=0.17,<1
      - -e ./third_party/DecisionNCE
      - -e .
