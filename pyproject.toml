[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clad-reproduce"
version = "0.1.0"
description = "Unofficial reproduction of Cross-Modal Latent Dynamics (CLaD)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "h5py>=3.8,<4",
  "numpy>=1.24,<2",
  "PyYAML>=6,<7",
  "torch>=2.1,<2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "ruff>=0.5,<1",
]
train = [
  "einops>=0.7,<1",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "tqdm>=4.66,<5",
  "wandb>=0.17,<1",
]
eval = [
  "bddl==1.0.1",
  "cloudpickle>=2.1,<4",
  "easydict==1.9",
  "future==0.18.2",
  "gym==0.25.2",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.5,<1",
  "matplotlib>=3.5,<4",
  "mujoco==2.3.7",
  "robosuite==1.4.0",
  "termcolor>=2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
