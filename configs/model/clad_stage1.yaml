# Dimensions obtained from the selected DecisionNCE checkpoint and LIBERO
# data interface. The paper does not report Dv, Dl, Dp, or Da. We follow the
# official LIBERO policy observation fields: 7D joint position plus 2D gripper.
vision_feature_dim: 1024
text_feature_dim: 1024
proprio_dim: 9
proprioception: libero_joint_gripper
action_dim: 7

# Paper-reported settings from Section 5.1 and supplementary Section 10.
hidden_dim: 1024
num_proprio_tokens: 4
num_semantic_tokens: 4
horizon: 6
action_mask_ratio: 0.3

# Explicit reproduction assumptions: the paper specifies MLP encoders but not
# their depth/dropout, action positional encoding, or multi-view fusion.
tokenizer_mlp_hidden_dim: 1024
tokenizer_dropout: 0.0
view_fusion: mean

# Cross-attention depth/head count are not reported. Eight layers per stack
# makes the completed three-stack CLaD model approach the reported 0.33B
# parameter budget; 16 heads gives a conventional 64-dimensional head. The
# Perceiver-style q_out pooling uses one additional cross-attention block.
cross_attention:
  num_layers: 8
  num_heads: 16
  ffn_multiplier: 4.0
  attention_dropout: 0.0
  residual_dropout: 0.0
  norm_eps: 1.0e-5

# Equation (11)--(19). EMA momentum and reconstruction weight are reported;
# MLP widths and mean pooling over EMA target tokens are reproduction
# assumptions because the paper does not provide those details.
foresight:
  predictor_hidden_dim: 1024
  decoder_hidden_dim: 1024
  dropout: 0.0
  ema_momentum: 0.995
  reconstruction_weight: 0.1
  normalization_eps: 1.0e-6
  target_pooling: mean
