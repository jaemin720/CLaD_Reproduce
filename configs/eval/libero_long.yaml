# The CLaD paper reports 50 rollouts for its single-checkpoint protocol.
# Fixed initial states come from the standard LIBERO benchmark API; the paper
# does not specify their order, seeds, image size, or episode horizon.
suite_name: libero_10
task_order_index: 0
task_ids: []
rollouts_per_task: 50

# LIBERO's official evaluator also uses subprocess vector environments. CLaD
# keeps one policy/DecisionNCE copy on the selected GPU and batches inference
# across this many same-task rollouts. Start with 2 for a smoke test, then use
# 4 (default) or benchmark 8 if host RAM and EGL/VRAM capacity permit.
num_envs: 4
max_steps: 600

# Match the native-256/OpenVLA-style regeneration protocol: settle for ten
# steps while explicitly commanding the Panda gripper open (-1). A zero
# gripper command targets the controller midpoint and can partially close an
# initially open gripper. CLaD history observes these exact warm-up actions.
warmup_steps: 10
warmup_gripper_action: -1.0

# The paper generates six-action chunks but does not state the deployment
# replanning interval. Executing all six is the default reproduction choice;
# set this to 1 for per-control-step receding-horizon replanning.
execution_steps: 6

camera_height: 128
camera_width: 128
# Keep simulator placement randomness separate from per-episode DDPM noise.
# The regenerated dataset and OpenVLA LIBERO environment both use seed 0.
environment_seed: 0
seed: 42
clip_actions: true
save_videos: false
video_fps: 20
video_observation_key: agentview_image
render_gpu_device_id: -1
resume: true
