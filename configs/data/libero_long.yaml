dataset_dir: /data/jack/libero_datasets/libero_10
file_pattern: "*_demo.hdf5"

# Dataset paths are relative to each data/demo_N group. The paper-faithful
# default uses one external view. Add obs/eye_in_hand_rgb for multi-view
# experiments without changing the dataset interface.
camera_keys:
  - obs/agentview_rgb
proprio_key: robot_states
action_key: actions

# Paper setting: action and foresight horizon tau = 6.
horizon: 6
include_images: true
strict: true
