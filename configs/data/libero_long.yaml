# Override with --dataset-dir or set LIBERO_DATASET_DIR for the launch scripts.
dataset_dir: /path/to/libero_datasets/libero_10
file_pattern: "*_demo.hdf5"

# Dataset paths are relative to each data/demo_N group. The paper does not
# report its camera-view count; one external view is this reproduction's
# explicit default. Add obs/eye_in_hand_rgb for multi-view experiments without
# changing the dataset interface.
camera_keys:
  - obs/agentview_rgb

# Official LIBERO policy observation fields: joint position 7D followed by
# gripper position 2D. The legacy EEF-based robot_states contract remains
# available by setting proprioception: robot_states explicitly.
proprioception: libero_joint_gripper
action_key: actions

# Paper setting: action and foresight horizon tau = 6.
horizon: 6
include_images: true
strict: true
